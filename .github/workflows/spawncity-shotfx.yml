name: SpawnCity Schusseffekte (Original)

# Reference screenshots of the original's shot effects (spawncity.de): every weapon fired with the
# page clock slowed down (kern/games/spawncity/tests/shotfx_original.mjs). Results go to the branch
# schusseffekte-ergebnis and as an artifact.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: Steps (comma separated)
        default: glock,smg,sniper,grenade,rocket,nade,drone,dronerocket

permissions:
  contents: write

jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Shots
        env:
          STEPS: ${{ inputs.steps }}
        run: node kern/games/spawncity/tests/shotfx_original.mjs generated/shotfx-original https://spawncity.de/drone_simulator.html 2>&1 | tee generated-shotfx.log
      - name: Results to branch schusseffekte-ergebnis
        if: always()
        run: |
          set -euo pipefail
          mkdir -p generated/shotfx-original && cp generated-shotfx.log generated/shotfx-original/ || true
          cd generated/shotfx-original
          git init -q -b schusseffekte-ergebnis
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Schusseffekte ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" schusseffekte-ergebnis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shotfx-original
          path: generated/shotfx-original
          retention-days: 14
