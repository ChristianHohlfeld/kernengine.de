name: CI

# Engine CI: build and test Kern independently of SpawnCity (spawncity.yml).
# Publish only after all engine checks succeed. Manual probe/beleg calls stay here.
#   native  unit tests with ASan / UBSan
#   build   Kern Studio + example games (parallel ThinLTO; nothing kept between runs - each job builds anew)
#   e2e     the browser test against the built Studio
#   input   the browser test of the input of every host (the reader's contract, the example
#           games)
#   deploy  main only: publishes the site to the gh-pages branch
#           https://kernengine.de/ (custom domain via the CNAME file)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      probe:
        description: "Only the converter over these sources (kern/games/spawncity, e.g. 'src/qr.cpp src/town_sync.cpp'), with their tests' errors - no other job; 'all_program': every Blueprint as a class of the program, each file compiled (tools/all_program.sh)"
        default: ""
      source_numbers:
        description: "With probe: '1' = the second pass of the comparison too (KERN_TEST_SOURCE_NUMBERS=1: each Blueprint's test once more with the source's own numbers, test_<x>_source.cpp); the probe then starts from a level and a project without Blueprints, builds the tests it wrote and runs them (tools/converter_cases/compare.sh, tools/source_numbers.py)"
        default: ""
      beleg:
        description: "Only the proof of one lowering in the form 'two builds': the driver tests/lowered/builds/<file> (e.g. 'game_town') - no other job (tests/lowered/BELEGE.md)"
        default: ""

permissions:
  contents: write

# A newer push to a pull request makes its older run moot; on main every push runs to the end, so
# every green main state is published (a run takes ~17 min and main gets pushes more often).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}-${{ (inputs.probe || inputs.beleg) && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KERN_RUN_DIR: /home/runner/kern-run   # (the folder of a job's run - kern/tools/run_dir.sh: a fresh runner, nothing from another run; no cache)

jobs:
  # A probe (workflow_dispatch with "probe"): the converter over the named sources on a runner of its own, as mag's "probe" does it - what it
  # converts, what waits and why, and whether the tests it writes compile. It writes into a copy; the level of the state stays as it is.
  probe:
    if: ${{ inputs.probe != '' && inputs.probe != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340   # (the whole program on 4 cores takes hours: a probe of all sources is allowed to)
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk 25 (the probe "all_program" builds for the browser too)
        if: ${{ inputs.probe == 'all_program' }}
        run: |
          set -euo pipefail
          mkdir -p /home/runner/wasi-sdk
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi-sdk.tar.gz -C /home/runner/wasi-sdk --strip-components=1
      - name: Convert
        env:
          SOURCES: ${{ inputs.probe }}
          KERN_TEST_SOURCE_NUMBERS: ${{ inputs.source_numbers }}
        run: |
          W=/home/runner/probe; mkdir -p "$W/pt/converted" "$W/texts" "$W/keep"
          if [ "$SOURCES" = all_program ]; then  # (the whole game as classes: kern/games/spawncity/tools/all_program.sh)
            set +e
            command -v /usr/bin/time > /dev/null || sudo apt-get install -y -qq time > /dev/null
            WASI_SDK=/home/runner/wasi-sdk KERN_JOBS=4 LINK=1 WEB=1 TICKS=600 kern/games/spawncity/tools/all_program.sh "$W/all" > "$W/convert.log" 2>&1; rc=$?
            tail -n 200 "$W/convert.log"; cp "$W/all/files.txt" "$W/texts/" 2>/dev/null; cp -r "$W/all/logs" "$W/all/link.log" "$W/all/run.log" "$W/all/refresh.log" "$W/all/web.log" "$W/texts/" 2>/dev/null; exit $rc
          fi
          cp kern/games/spawncity/level/spawncity.klevel "$W/pt/l.klevel"; cp kern/games/spawncity/level/spawncity.kproject "$W/pt/l.kproject"
          if [ "$KERN_TEST_SOURCE_NUMBERS" = 1 ]; then   # (the tests are built: from a level of no Blueprint but what this probe writes - the level's others may be older than the engine - and the project's Blueprints, the classes the program calls (people.cpp: person_hit); one that does not build is said by compare.sh)
            python3 -c "import json,sys; d=sys.argv[1]; l=json.load(open(d+'/l.klevel')); l['actors']=[]; json.dump(l,open(d+'/l.klevel','w')); p=json.load(open(d+'/l.kproject')); p['levels']=['l.klevel']; p['startLevel']='l.klevel'; json.dump(p,open(d+'/l.kproject','w'))" "$W/pt"
          fi
          cd kern/games/spawncity
          set +e
          KERN_JOBS=4 CLANGXX=clang++ FUNCTIONS=1 TEST_ERRORS=1 TEST_KEEP="$W/keep" python3 ../../../tools/cpp_to_blueprint.py --convert sc --program firmware=fc,hwcontract --folder Source --classes level_blueprints.h \
            -I../../include -I../../third_party/box3d/include -Isrc --level "$W/pt/l.klevel" --project "$W/pt/l.kproject" --test "$W/pt/converted" --texts "$W/texts" -- $SOURCES > "$W/convert.log" 2>&1
          rc=$?; cat "$W/convert.log"; echo "convert rc=$rc"
          # (what the texts name of the engine's libraries that they do not have: tools/engine_api.py --check - its status itself, no pipe)
          python3 ../../../tools/engine_api.py --check "$W/texts"; echo "engine_api --check rc=$?"
          if [ "$KERN_TEST_SOURCE_NUMBERS" = 1 ] && [ $rc = 0 ]; then   # (the tests it wrote, built and run: both passes, function by function)
            game_sources=(); for f in src/*.cpp; do [ "$(basename "$f")" = main.cpp ] || grep -q '#include "game.h"' "$f" || game_sources+=("$PWD/$f"); done
            KERN_JOBS=4 CLANGXX=clang++ INCLUDES="-I$PWD/src" ../../../tools/converter_cases/compare.sh "$W/pt/l.kproject" "$W/pt/l.klevel" "$W/pt/converted" "$W/built" "${game_sources[@]}"; echo "compare rc=$?"
            grep -E "^(ok|FAIL) +converted_|^[0-9]+ tests," "$W/built/compare.log" | tail -n 80
            grep -E "interp && native \||problems.empty\(\) \|" "$W/built/compare.log" | cut -c1-400 | head -n 20   # (a Blueprint that does not run in the test: why)
            python3 ../../../tools/source_numbers.py "$W/pt/converted" "$W/built/compare.log" | tee "$W/texts/numbers.txt"
            cp "$W/built/compare.log" "$W/texts/" 2>/dev/null
          fi
          exit $rc   # (the whole log: a session without access to the artifacts reads it here)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            /home/runner/probe/convert.log
            /home/runner/probe/pt/converted
            /home/runner/probe/texts
            /home/runner/probe/keep
          retention-days: 2

  # A proof of one lowering (workflow_dispatch with "beleg"): its driver in the form "two builds" - the old tree's program
  # and today's, the engine as it stands -, nothing else (tests/run_tests.sh, SC_BELEG; the result goes to BELEGE.md).
  beleg:
    if: ${{ inputs.beleg != '' && inputs.beleg != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # (the old tree: git archive of the driver's base)
      - name: Two builds
        env:
          SC_BELEG: ${{ inputs.beleg }}
          SC_TEST_OUT: /home/runner/sc-tests
          KERN_JOBS: 4
        run: CXX=clang++ CC=clang kern/games/spawncity/tests/run_tests.sh

  # The converter's small cases (tools/converter_cases): forms of the game's C++ and what their Blueprint text must say.
  converter-cases:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # (the cases of the numbers build their comparison tests with the engine)
    steps:
      - uses: actions/checkout@v4
      - name: Converter cases
        run: CLANGXX=clang++ tools/converter_cases/run.sh

  native:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # (no cache: 23-25 min, 30.3 on a slow runner - run 45851778529 was cut off; room for slow runners)
    steps:
      - uses: actions/checkout@v4
      - name: Native unit tests (ASan/UBSan)
        run: CXX=g++ CC=gcc kern/tests/run.sh

  # The engine's native build on a minimal project of its own (kern/tools/build_native.sh, kern/docs/app.md 7.).
  native-build:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build_native.sh on kern/tests/native_build
        run: CXX=clang++ CC=clang kern/tests/native_build/run.sh

  # Bit-identical everywhere (docs/lehrer.md, determinism): the Lehrer built with Apple clang on
  # ARM must step the duck exactly as GCC on x86 and WebAssembly do (the golden hashes).
  determinism:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Lehrer (Apple clang, arm64)
        run: KERN_NATIVE=1 kern/tools/lehrer.sh build-mac
      - name: Same hashes as x86 and wasm
        run: build-mac/kern_lehrer --fingerprint 400 | diff - kern/tests/determinism_fingerprint.txt
      - name: Complete native checkpoint and exact continuation
        run: python3 kern/tests/lehrer_native_checkpoint_test.py build-mac/kern_lehrer

  build:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # (no cache: 12-16 min; room for slow runners)
    env:
      KERN_RUN_DIR: /home/runner/kern-run   # (the folder of this job's run - kern/tools/run_dir.sh; a fresh runner: nothing from another run)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lehrer remote transport and MAG lease (mock trainer)
        run: |
          python3 kern/tests/lehrer_remote_test.py
          node kern/tests/lehrer_remote_test.mjs
          bash -n kern/tools/lehrer.sh
      - name: Install wasi-sdk 25
        run: |
          set -euo pipefail
          mkdir -p /home/runner/wasi-sdk
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi-sdk.tar.gz -C /home/runner/wasi-sdk --strip-components=1
      - name: Build Kern Studio and the example games
        shell: bash
        run: |
          build() {
            export WASI_SDK=/home/runner/wasi-sdk
            test -x "$WASI_SDK/bin/clang++"  # the toolchain is really there
            tools/build_studio.sh
            kern/build.sh --app kern/examples/hello/hello.wasm kern/examples/hello/hello.cpp
            kern/build.sh --app kern/examples/orbrun/orbrun.wasm kern/examples/orbrun/orbrun.cpp
            kern/build.sh --lehrer generated/kern_lehrer.wasm
            # The native export: a level as a game with its Blueprints compiled in as C++ classes
            # (the browser test plays it: kern/tests/e2e/export_e2e.mjs).
            tools/export_game.sh kern/tests/e2e/native_export.klevel generated/native_export.html
            for f in kern/web/kern.mjs kern/web/app.mjs kern/web/jobs.mjs kern/web/studio/*.mjs tools/net_relay.mjs tools/export_game.mjs; do node --check "$f"; done
            python3 -I tools/kern_notices.py --check
          }
          # Keep the build outside an if/! condition: Bash disables errexit in tested functions.
          set -euo pipefail
          build 2>&1 | tee /tmp/build.log
      - name: Lehrer in WebAssembly (one PPO iteration through the workers' C ABI)
        run: node kern/tests/lehrer_wasm_test.mjs generated/kern_lehrer.wasm
      - name: Logic JIT (graphs compiled to WebAssembly must match the interpreter)
        run: |
          set -euo pipefail
          export WASI_SDK=/home/runner/wasi-sdk
          kern/build.sh /tmp/logic_test.wasm kern/tests/logic_wasm_test.cpp -Ikern/tests
          node kern/tests/logic_wasm_test.mjs /tmp/logic_test.wasm
      - name: Mathematics of the standard library is the engine's in WebAssembly (math_names.h)
        run: |
          set -euo pipefail
          export WASI_SDK=/home/runner/wasi-sdk
          kern/build.sh /tmp/math_names_test.wasm kern/tests/math_names_wasm_test.cpp -Ikern/tests
          node kern/tests/math_names_wasm_test.mjs /tmp/math_names_test.wasm
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/editor _site/generated _site/kern/web/studio _site/kern/examples
          # The landing page, Impressum and Datenschutz; self-hosted fonts when site/fonts exists.
          cp site/*.html _site/
          if [ -d site/fonts ]; then cp -r site/fonts _site/; fi
          cp -r site/img _site/  # the landing page's pictures (book cover, screenshots, author)
          cp LICENSE _site/LICENSE.txt && cp kern/LICENSES.md _site/LICENSES.txt
          if [ -f LICENSING.md ]; then cp LICENSING.md _site/LICENSING.txt; fi
          # The editor as an installable app: build SHA as the page's first comment, build.json for
          # the update check, the manifest, the service worker and the icons (site/editor).
          { echo "<!--BUILD_SHA:${GITHUB_SHA}-->"; cat generated/studio.html; } > _site/editor/index.html
          printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > _site/editor/build.json
          cp -r site/editor/. _site/editor/
          # The Micro Duck's policy set (Apache-2.0): the editor loads the moves it needs from here.
          mkdir -p _site/editor/microduck && cp kern/third_party/microduck/*.onnx _site/editor/microduck/
          # Kern's own trained networks (docs/lehrer.md): the jump.
          mkdir -p _site/editor/policies && cp kern/policies/*.onnx _site/editor/policies/
          cp generated/kern_studio.wasm _site/generated/
          # The Lehrer (docs/lehrer.md) is a workspace of the editor; the module its workers train
          # with lies beside the editor (and in generated/ for the module page kern/web/studio/).
          cp generated/kern_lehrer.wasm _site/editor/
          cp generated/kern_lehrer.wasm _site/generated/
          # Its old addresses (/lehrer/, /train/) lead into the workspace.
          for old in lehrer train; do
            mkdir -p _site/$old && printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../editor/?train=1"><a href="../editor/?train=1">Kern Studio: Lehrer</a>\n' > _site/$old/index.html
          done
          cp kern/web/kern.mjs kern/web/app.mjs kern/web/jobs.mjs _site/kern/web/
          cp kern/web/studio/*.mjs kern/web/studio/*.html kern/web/studio/*.css _site/kern/web/studio/
          for g in hello orbrun; do
            mkdir -p _site/kern/examples/$g
            cp kern/examples/$g/index.html kern/examples/$g/$g.wasm _site/kern/examples/$g/
          done
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-export
          path: generated/native_export.html
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, native, native-build, converter-cases, determinism, e2e, input, murmel, murmel-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false  # a running publish finishes; only the newest waiting one follows
    steps:
      # Keep the last published game files; do not rebuild or publish a new SpawnCity here.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _previous-pages
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          for p in spawncity spawncity.html spawncity-de kern/games/spawncity/web sim/audio/8_bits_only.m4a; do
            if [ -e "_previous-pages/$p" ]; then
              mkdir -p "_site/$(dirname "$p")"
              cp -a "_previous-pages/$p" "_site/$p"
            fi
          done
          cd _site
          touch .nojekyll
          echo kernengine.de > CNAME  # the custom domain; without this file every publish would drop it
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
  e2e:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # (no cache: 10-17 min; room for slow runners)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: native-export
          path: generated
      - name: Browser end-to-end test
        run: |
          set -euo pipefail
          mkdir -p generated && cp _site/editor/index.html generated/studio.html && cp _site/generated/kern_studio.wasm generated/
          # the app files next to the page, as deployed (manifest, icons, service worker, the Lehrer's module)
          cp -r _site/editor/manifest.webmanifest _site/editor/sw.js _site/editor/build.json _site/editor/icons _site/editor/microduck _site/editor/kern_lehrer.wasm generated/
          [ -d /tmp/e2e/node_modules/playwright ] || npm install --prefix /tmp/e2e --no-audit --no-fund playwright@1.56.0
          # The browser itself (from Playwright's CDN, in every run - no cache) is what the test needs. Its system
          # packages - fonts above all - come from Ubuntu's archive: when that cannot be reached
          # within three minutes, the test runs with what the runner image has.
          /tmp/e2e/node_modules/.bin/playwright install chromium || { echo "::error::playwright install failed"; exit 1; }
          timeout 180 /tmp/e2e/node_modules/.bin/playwright install-deps chromium || echo "::warning::playwright install-deps failed: Ubuntu's archive is not reachable"
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 1
          mkdir -p artifacts/e2e
          NODE_PATH=/tmp/e2e/node_modules node kern/tests/e2e/studio_e2e.mjs http://127.0.0.1:8771
          # functions and formulas in the Blueprint editor (the engine's cases: no game's level)
          NODE_PATH=/tmp/e2e/node_modules node kern/tests/e2e/blueprint_e2e.mjs http://127.0.0.1:8771
          # the native export: a game whose Blueprints run as their compiled C++ classes
          NODE_PATH=/tmp/e2e/node_modules node kern/tests/e2e/export_e2e.mjs http://127.0.0.1:8771/generated/native_export.html
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: artifacts/e2e/
          if-no-files-found: ignore

  input:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Input test
        run: |
          set -euo pipefail
          [ -d /tmp/e2e/node_modules/playwright ] || npm install --prefix /tmp/e2e --no-audit --no-fund playwright@1.56.0
          # The browser itself (from Playwright's CDN, in every run - no cache) is what the test needs. Its system
          # packages - fonts above all - come from Ubuntu's archive: when that cannot be reached
          # within three minutes, the test runs with what the runner image has.
          /tmp/e2e/node_modules/.bin/playwright install chromium || { echo "::error::playwright install failed"; exit 1; }
          timeout 180 /tmp/e2e/node_modules/.bin/playwright install-deps chromium || echo "::warning::playwright install-deps failed: Ubuntu's archive is not reachable"
          # the example games as built, next to their pages
          for g in hello orbrun; do cp _site/kern/examples/$g/$g.wasm kern/examples/$g/; done
          python3 -m http.server 8772 --bind 127.0.0.1 >/tmp/http-input.log 2>&1 &
          sleep 1
          NODE_PATH=/tmp/e2e/node_modules node kern/tests/e2e/input_e2e.mjs http://127.0.0.1:8772

  # Murmel (kern/games/murmel): das zweite Spiel, allein aus der Engine gebaut - der Maßstab neben SpawnCity. Nativ:
  # die Welt-Blueprints der Levels sind ihre Texte (blueprints/*.cpp), der Lauf mit Tasten ist deterministisch
  # (tests/run.sh, tests/erwartet.txt), der Konverter liest die Quelle der App (tests/convert.sh).
  murmel:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Murmel nativ (deterministischer Lauf)
        run: CXX=clang++ CC=clang kern/games/murmel/tests/run.sh
      - name: Die Blueprints der Levels sind ihre Texte
        if: success() || failure()
        run: kern/games/murmel/tests/blueprints.sh --check
      - name: Der Konverter über die Quelle der App
        if: success() || failure()
        run: CLANGXX=clang++ kern/games/murmel/tests/convert.sh

  # Murmel im Browser: das Modul des Spiels und Kern Studio gebaut, dann spielt der e2e-Test die Seite des Spiels per
  # Tastatur und das Start-Level im Editor (Play).
  murmel-web:
    if: ${{ (inputs.probe == '' || inputs.probe == null) && (inputs.beleg == '' || inputs.beleg == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KERN_RUN_DIR: /home/runner/kern-run   # (the folder of this job's run - kern/tools/run_dir.sh; a fresh runner: nothing from another run)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasi-sdk 25
        run: |
          set -euo pipefail
          mkdir -p /home/runner/wasi-sdk
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi-sdk.tar.gz -C /home/runner/wasi-sdk --strip-components=1
      - name: Murmel und Kern Studio bauen
        run: |
          set -euo pipefail
          export WASI_SDK=/home/runner/wasi-sdk
          kern/games/murmel/build.sh
          tools/build_studio.sh
          # the export of a project with its App: one page for itself (kern/docs/app.md 7.)
          tools/export_game.sh kern/games/murmel/murmel.kproject generated/murmel.html kern/games/murmel/src/main.cpp
      - name: Murmel e2e
        run: |
          set -euo pipefail
          [ -d /tmp/e2e/node_modules/playwright ] || npm install --prefix /tmp/e2e --no-audit --no-fund playwright@1.56.0
          /tmp/e2e/node_modules/.bin/playwright install chromium || { echo "::error::playwright install failed"; exit 1; }
