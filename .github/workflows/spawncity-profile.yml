name: SpawnCity Profil

# Where the frame time goes: Kern and the original on the same runner, same steps (tests/profile.mjs).
on:
  workflow_dispatch:
    inputs:
      kern_url:
        default: https://kernengine.de/kern/games/spawncity/web/index.html?menu=1
      original_url:
        default: https://spawncity.de/drone_simulator.html
      modes:
        default: foot drone car

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - run: node kern/games/spawncity/tests/profile.mjs "${{ inputs.kern_url }}" generated/profile kern ${{ inputs.modes }} || true
      - run: node kern/games/spawncity/tests/profile.mjs "${{ inputs.original_url }}" generated/profile original ${{ inputs.modes }} || true
      - name: Results to branch profil-ergebnis
        if: always()
        run: |
          set -euo pipefail
          cd generated/profile
          git init -q -b profil-ergebnis
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Profil ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" profil-ergebnis
