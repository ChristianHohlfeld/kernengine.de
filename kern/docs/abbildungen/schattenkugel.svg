<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 172">
  <!-- Schattenkarte mit Schattendistanz, von oben: blau der Sichtkegel bis zur Schattendistanz (Auge = Punkt), grau die Fläche, die die Karte abdecken muss. Ein Kasten in festen Achsen der Sonne ändert beim Drehen seine Größe, die umschließende Kugel nicht. Kugel nach Renderer (blau 4): c = min(f, (f + n)(1 + k)/2), r = √((f − c)² + f²k), gezeichnet für Studios Kamera, 70° Öffnungswinkel und 16:9 (dann c = f). -->
  <rect class="ffd" x="7.72" y="94" width="104.56" height="42"/>
  <rect class="l" x="7.72" y="94" width="104.56" height="42"/>
  <path class="fa" d="M60,136 L7.72,94 L112.28,94 Z"/>
  <circle class="dot" cx="60" cy="136" r="2"/>
  <text x="60" y="146" class="k m">{{auge}}</text>
  <text x="60" y="157" class="m t">{{titel0}}</text>
  <text x="60" y="168" class="k m">{{folge0}}</text>
  <rect class="ffd" x="143.95" y="68.79" width="80.1" height="67.21"/>
  <rect class="l" x="143.95" y="68.79" width="80.1" height="67.21"/>
  <path class="fa" d="M211,134.57 L143.95,136 L224.05,68.79 Z"/>
  <circle class="dot" cx="211" cy="134.57" r="2"/>
  <text x="184" y="157" class="m t">{{titel1}}</text>
  <text x="184" y="168" class="k m">{{folge1}}</text>
  <circle class="ffd" cx="314" cy="80" r="59.99"/><circle class="l" cx="314" cy="80" r="59.99"/>
  <path class="fa" d="M314,122 L261.72,80 L366.28,80 Z"/>
  <circle class="dot" cx="314" cy="122" r="2"/>
  <circle class="dot" cx="314" cy="80" r="1.8"/>
  <path class="ld" d="M314,80 L343.99,28.05"/>
  <text x="332" y="60" class="k">{{radius}}</text>
  <text x="314" y="92" class="k m">{{mitte}}</text>
  <text x="314" y="157" class="m t">{{titel2}}</text>
  <text x="314" y="168" class="k m">{{folge2}}</text>
  <rect class="fa" x="2" y="3" width="9" height="7"/><text x="15" y="10" class="k">{{kopf}}</text>
  <rect class="fd" x="2" y="14" width="9" height="7"/><text x="15" y="21" class="k">{{kopf2}}</text>
</svg>
