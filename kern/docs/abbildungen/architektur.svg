<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 392">
  <!-- Schichten von Kern (blau 1, Architektur): oben der Browser-Teil (kern/web), darunter das WebAssembly-Modul; jede Schicht nutzt nur die darunter. Grün und gelb zeigen dieselben Schichten mit einfachen Namen. -->
