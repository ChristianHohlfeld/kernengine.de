<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 402">
  <!-- Schichten von Kern (blau 1, Architektur; Abhängigkeiten nach den #include der Module und kern/build.sh): oben der Browser-Teil (kern/web), darunter das WebAssembly-Modul. Jede Schicht nutzt nur die darunter, aber nicht jede alles: Ton, Logik und Netzwerk stehen direkt auf den Grundlagen, die Physik nur auf der Geometrie (geo/mesh_data.h), die Laufzeit für C++-Spiele (--app) auf der Grafik. Spielregeln (--game) stehen auf der Physik, Studio und Lehrer auf den Spielregeln. Grün und gelb zeigen dieselben Schichten mit einfachen Namen. -->
  <text x="2" y="10" class="t" data-nur="blau">{{js_titel}}</text>
  <rect class="fw" x="1" y="16" width="378" height="62" rx="2"/>
  <text x="8" y="28" class="c" data-nur="blau">kern.mjs</text>
  <text x="70" y="28" class="k" data-nur="blau">{{js1a}}</text>
  <text x="8" y="49" class="c" data-nur="blau">app.mjs</text>
  <text x="70" y="49" class="k" data-nur="blau">{{js2}}</text>
  <text x="8" y="59.5" class="c" data-nur="blau">studio/*.mjs</text>
  <text x="70" y="59.5" class="k" data-nur="blau">{{js3}}</text>
  <text x="8" y="70" class="c" data-nur="blau">lehrer/*.mjs</text>
  <text x="70" y="70" class="k" data-nur="blau">{{js4}}</text>
  <text x="70" y="38.5" class="k" data-nur="blau">{{js1b}}</text>
  <text x="190" y="51" class="m t" data-nur="gruen gelb">{{js_einfach}}</text>
