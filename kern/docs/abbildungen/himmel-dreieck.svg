<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 166">
  <!-- Der Himmel als ein bildschirmfüllendes Dreieck: sky.cpp erzeugt aus gl_VertexID die Ecken (−1, −1), (3, −1), (−1, 3) in Bildschirmkoordinaten; das Quadrat −1…1 ist der Bildschirm, der Rest wird weggeschnitten. -->
  <path class="ffa" d="M70,150 L206,150 L70,14 Z"/>
  <rect class="fd" x="70" y="82" width="68" height="68"/>
  <path class="la" d="M70,150 L206,150 L70,14 Z"/>
  <text x="104" y="115" class="m">{{bild}}</text>
  <text x="104" y="126" class="k m">{{rand}}</text>
  <circle class="dota" cx="70" cy="150" r="2"/>
  <text x="66" y="162" class="k e">(−1, −1)</text>
  <circle class="dota" cx="206" cy="150" r="2"/>
  <text x="210" y="162" class="k ">(3, −1)</text>
  <circle class="dota" cx="70" cy="14" r="2"/>
  <text x="66" y="17" class="k e">(−1, 3)</text>
  <text x="168" y="64" class="k a">{{weg1}}</text>
  <text x="168" y="74" class="k a">{{weg2}}</text>
</svg>
