  <text x="48" y="62" class="k m t">{{ziel1}}</text><text x="48" y="72" class="k m">{{ziel2}}</text>
  <rect class="f" x="300" y="20" width="62" height="92" rx="3"/>
  <text x="331" y="62" class="k m t">{{gelenk1}}</text><text x="331" y="72" class="k m">{{gelenk2}}</text>
  <path class="l" d="M70,40 L120,40 L130,46 L140,34 L150,46 L160,34 L170,46 L180,34 L190,46 L200,34 L210,46 L220,34 L230,46 L240,40 L300,40"/>
