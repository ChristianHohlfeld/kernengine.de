  <text x="64" y="12"><tspan class="t">z</tspan> {{z}}</text>
  <text x="138" y="44" class="a"><tspan class="t">y</tspan> {{y}}</text>
  <text x="156" y="76" class="k h m">{{boden}}</text>
</svg>
