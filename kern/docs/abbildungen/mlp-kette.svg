<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 50">
  <!-- Das Laufnetz der Ente als Kette: 61 Eingänge, Normalisierer (im ONNX-Export Sub und Div), Gemm 61→512, 512→256, 256→128 jeweils mit ELU, zuletzt Gemm 128→14 linear (blau A.1.3 und A.14; PpoConfig::actor_hidden). -->
