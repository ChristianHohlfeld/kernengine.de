  <text x="221" y="37.5" class="k m" data-nur="blau gelb">{{akt2}}</text>
  <text x="221" y="23" class="k m" data-nur="gruen">{{l2}}</text>
  <text x="221" y="33" class="k m" data-nur="gruen">{{akt}}</text>
  <path class="l p" d="M246,25 L250,25"/>
