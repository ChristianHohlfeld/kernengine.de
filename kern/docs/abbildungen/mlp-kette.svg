  <rect class="f" x="141" y="8" width="50" height="34" rx="3"/>
  <text x="166" y="18.5" class="k m" data-nur="blau gelb">{{l1}}</text>
  <text x="166" y="28" class="k m" data-nur="blau gelb">{{akt}}</text>
  <text x="166" y="37.5" class="k m" data-nur="blau gelb">{{akt2}}</text>
  <text x="166" y="23" class="k m" data-nur="gruen">{{l1}}</text>
  <text x="166" y="33" class="k m" data-nur="gruen">{{akt}}</text>
