<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SpawnCity - auf Kern</title>
<style>
  :root { color-scheme: dark; --glass: rgba(8, 12, 18, .58); --line: rgba(255, 255, 255, .14); --text: #eef3f8; --muted: #9fb0c2; --accent: #ffb547; --hot: #ff5a3c; --ok: #6be3a5; }
  html:not(.sc-original-view), html:not(.sc-original-view) body { margin: 0; height: 100%; background: #0b0f14; color: var(--text); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font: 500 13px/1.3 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  #stage { position: fixed; inset: 0; }
  html:not(.sc-original-view) canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 14px 20px; background: var(--glass); border: 1px solid var(--line);
    border-radius: 12px; backdrop-filter: blur(8px); font-weight: 600; letter-spacing: .02em; pointer-events: none; max-width: 80vw; text-align: center; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  .sc-top { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: flex; gap: 10px; align-items: center; }
  .sc-badge { padding: 5px 10px; border-radius: 8px; background: var(--glass); border: 1px solid var(--line); font-weight: 800; letter-spacing: .08em; font-size: 12px; }
  .sc-stars { color: var(--accent); font-size: 16px; letter-spacing: 2px; }
  .sc-fps { color: var(--muted); font-size: 11px; }
  .sc-map { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); width: 150px; height: 150px;
            border-radius: 50%; background: rgba(12, 16, 22, .55); border: 1px solid var(--line); }
  body.sc-touch-on .sc-map { width: 104px; height: 104px; }
  .sc-toast { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); padding: 7px 14px; border-radius: 10px;
    background: var(--glass); border: 1px solid var(--line); font-weight: 650; }
  .sc-offline { position: absolute; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 40px); transform: translateX(-50%); padding: 6px 12px; border-radius: 8px;
    background: rgba(120, 60, 0, .72); border: 1px solid rgba(255, 181, 71, .6); color: #ffd9a0; font-weight: 700; font-size: 12px; letter-spacing: .03em; }
  .sc-cross { --spread: 10px; position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .sc-cross::before, .sc-cross::after { content: ""; position: absolute; background: rgba(255, 255, 255, .9); box-shadow: 0 0 2px #000; }
  .sc-cross::before { width: 2px; height: 10px; left: -1px; top: calc(-5px - var(--spread)); box-shadow: 0 calc(10px + 2 * var(--spread)) 0 rgba(255, 255, 255, .9); }
  .sc-cross::after { height: 2px; width: 10px; top: -1px; left: calc(-5px - var(--spread)); box-shadow: calc(10px + 2 * var(--spread)) 0 0 rgba(255, 255, 255, .9); }
  .sc-panel { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(34px, calc(env(safe-area-inset-bottom) + 24px)); min-width: 190px; padding: 10px 12px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); }
  .sc-speed b { font-size: 30px; font-weight: 800; } .sc-speed small { margin-left: 5px; color: var(--muted); }
  .sc-rows div { display: flex; justify-content: space-between; gap: 14px; font-size: 12px; } .sc-rows span { color: var(--muted); }
  .sc-rows .hot b { color: var(--hot); } .sc-rows .warn b { color: var(--accent); }
  body[data-mode="jet"] .sc-panel { color: #7dff9b; border-color: rgba(125, 255, 155, .35); } body[data-mode="jet"] .sc-rows span { color: #4fc070; }
  .sc-health { position: absolute; left: 50%; bottom: max(34px, calc(env(safe-area-inset-bottom) + 24px)); transform: translateX(-50%); width: min(260px, 40vw); height: 6px;
    border-radius: 3px; background: rgba(255, 255, 255, .15); overflow: hidden; }
  .sc-health i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #6be3a5, #b8f06a); }
  .sc-health.low i { background: var(--hot); }
  .sc-ammo { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(34px, calc(env(safe-area-inset-bottom) + 24px)); padding: 8px 12px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px; } .sc-ammo b { font-size: 24px; }
  .sc-banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 40; padding: 10px 18px; border-radius: 10px; background: #2c3320e8;
    border: 2px solid #b8c27a; color: #e8f0b8; font: 900 16px/1.1 Inter, system-ui, sans-serif; letter-spacing: .12em; pointer-events: none; text-align: center; }
  .sc-pop { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font: 700 clamp(15px, 2.6vw, 24px) Inter, system-ui, sans-serif; letter-spacing: .16em;
    color: #f5b301; text-shadow: 0 1px 4px #000b; pointer-events: none; white-space: nowrap; }
  .sc-guided { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); padding: 3px 9px; border-radius: 10px; background: #0b1118d0; border: 1px solid #ffb24a; color: #ffe2b8; font: 800 11px/1.3 system-ui, sans-serif; letter-spacing: .06em; pointer-events: none; white-space: nowrap; }
  .sc-scope { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0 min(38vh, 38vw), #000 calc(min(38vh, 38vw) + 2px)); }
  .sc-scope::before, .sc-scope::after { content: ""; position: absolute; left: 50%; top: 50%; background: #000c; }
  .sc-scope::before { width: min(76vh, 76vw); height: 1px; transform: translate(-50%, -50%); }
  .sc-scope::after { width: 1px; height: min(76vh, 76vw); transform: translate(-50%, -50%); }
  .sc-scope i { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #ff2a1a; }
  .sc-hint { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: var(--glass); border: 1px solid var(--accent);
    color: var(--accent); font-weight: 700; }
  /* desktop_controls.mjs #desktopKeyHints: centred under the top bar, fades 12 s after a change */
  .sc-help { position: absolute; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 102px); transform: translateX(-50%); max-width: min(70vw, 860px); padding: 4px 10px;
    border-radius: 6px; background: #0b0f1680; color: #dfe7f2cc; font: 600 10px/1.35 Inter, system-ui, sans-serif; letter-spacing: .04em; text-align: center; transition: opacity .6s; }
  .sc-help:empty { display: none; }
  .sc-help.faded { opacity: 0; }
  body.pad-input, body.pad-input canvas { cursor: none; }
  /* touch play: the credits stay readable but never take a thumb's touch from the controls */
  body.sc-touch-on .sc-attrib { pointer-events: none; font-size: 9px; }
  /* simulator.mjs syncSoloPresentationOrientation: a portrait phone plays a landscape turned by 90 deg
     (logical x = screen y, logical y = screen width - screen x); menus turn with it */
  html.sc-css-landscape body { position: fixed; left: 100vw; top: 0; width: 100vh; width: 100dvh; height: 100vw; transform: rotate(90deg); transform-origin: 0 0; overflow: hidden; }
  .sc-attrib { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10.5px; color: rgba(255, 255, 255, .78);
    pointer-events: auto; background: rgba(0, 0, 0, .35); padding: 2px 6px; border-radius: 4px; }
  .sc-attrib a { color: inherit; text-decoration: none; }
  body.sc-touch-on .sc-panel { left: auto; right: max(14px, env(safe-area-inset-right)); top: calc(max(12px, env(safe-area-inset-top)) + 40px); bottom: auto; min-width: 150px; }
  body.sc-touch-on .sc-ammo { bottom: auto; top: calc(max(12px, env(safe-area-inset-top)) + 40px); right: auto; left: max(14px, env(safe-area-inset-left)); }
  body.sc-touch-on .sc-fps { display: none; }
  /* Touch: a compact panel that ends above the context buttons over the right stick. */
  body.sc-touch-on .sc-panel { padding: 6px 10px; min-width: 130px; }
  body.sc-touch-on .sc-speed b { font-size: 20px; }
  body.sc-touch-on .sc-rows div:nth-child(n+3) { display: none; }
  @media (max-width: 640px) { .sc-fps { display: none; } .sc-speed b { font-size: 24px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="SpawnCity"></canvas></div>
<div id="hud"></div>
<div id="status">SpawnCity wird gestartet ...</div>
<script type="module">
  import {startSpawnCity} from "./host.mjs";
  startSpawnCity({url: "./spawncity.wasm"});
</script>
</body>
</html>
