<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Murmel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1018; color: #e8eef6; font: 15px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #fehler { position: fixed; left: 12px; top: 12px; padding: 6px 10px; background: rgba(120,0,0,.7); border-radius: 6px; white-space: pre; }
  #fehler:empty { display: none; }
  #hilfe { position: fixed; right: 12px; bottom: 12px; padding: 4px 8px; background: rgba(0,0,0,.4); border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fehler"></div>
<div id="hilfe">Pfeile/WASD/Stick rollen · Leertaste/A springt</div>
<script type="module">
  import {runKernApp} from "../../../web/app.mjs";
  // (die Anzeige des Spiels sind die Widgets der Engine - die App-Laufzeit zeichnet sie; hier steht nur, was vor ihr scheitert)
  const fehler = document.getElementById("fehler");
  runKernApp({canvas: document.getElementById("game"), url: "./murmel.wasm"})
    .then(app => (window.__kernApp = app))
    .catch(error => { fehler.textContent = String(error); window.__kernError = String(error); });
</script>
</body>
</html>
